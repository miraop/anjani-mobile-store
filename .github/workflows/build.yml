name: Build Website

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract website
        run: |
          unzip "anjani-mobile-store.zip" -d project
          shopt -s dotglob
          mv project/* .
          rm -rf project

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Upload hosting files
        uses: actions/upload-artifact@v4
        with:
          name: anjani-mobile-hosting-files
          path: dist
